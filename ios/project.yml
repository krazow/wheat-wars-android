# XcodeGen spec: `xcodegen generate` creates WheatWars.xcodeproj (done by the GitHub workflow)
name: WheatWars
options:
  bundleIdPrefix: com.fictionalsoftworks
  deploymentTarget: { iOS: "15.0" }
targets:
  WheatWars:
    type: application
    platform: iOS
    sources:
      - path: WheatWars
        excludes: ["game"]
      - path: WheatWars/game
        type: folder          # copied as-is into the app bundle
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fictionalsoftworks.wheatwars
        PRODUCT_NAME: WheatWars
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "220"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WheatWars/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
