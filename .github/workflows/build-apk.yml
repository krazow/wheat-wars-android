# Builds WheatWars.apk on GitHub's servers. Push this folder to a GitHub repo, open the Actions tab,
# run "Build Android APK", and download WheatWars-apk from the finished run.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); just accept its licenses
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk WheatWars-2.2.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: WheatWars-apk, path: WheatWars-2.2.0.apk }
