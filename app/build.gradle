plugins { id "com.android.application" }

android {
    namespace "com.fictionalsoftworks.wheatwars"
    compileSdk 34
    defaultConfig {
        applicationId "com.fictionalsoftworks.wheatwars"
        minSdk 24          // Android 7.0+
        targetSdk 34
        versionCode 220    // 2.2.0
        versionName "2.2.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // the game ships as plain files: don't compress the video so it can stream from the APK
    androidResources { noCompress += ["mp4"] }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
