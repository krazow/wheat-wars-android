html,body{margin:0;background:#07080c;-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 35%,#252b40 0%,#11131c 55%,#07080c 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;box-sizing:border-box;
 padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));

#crt{position:relative;padding:1.2vmin;border-radius:10px;flex:none;
 background:linear-gradient(160deg,#4a4f5c 0%,#2a2d36 40%,#16181e 100%);
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.28),inset -1px -1px 0 rgba(0,0,0,.6),0 0 0 1px #050608,0 10px 30px rgba(0,0,0,.65)}
#gfx{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
#scr{position:relative;z-index:1;white-space:pre;font-family:"Consolas","Lucida Console","Menlo","Courier New",monospace;
 font-size:16px;line-height:1.12;margin:0;text-shadow:0 1px 1px rgba(0,0,0,.7)}
#scr span{display:inline-block;height:1.12em;vertical-align:top}
#scr span.hd{color:transparent!important;text-shadow:none}
.ck{cursor:pointer}@media (hover:hover){.ck:hover{filter:brightness(1.35)}}
.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#pad{display:none;width:100%;max-width:640px;gap:6px;align-content:start;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0;padding:2px;box-sizing:border-box}
body.touch #pad{display:grid}
#pad button{font:bold 15px/1.15 "Consolas","Menlo","Courier New",monospace;color:#ffe066;min-width:0;
 background:linear-gradient(180deg,#4361c9 0%,#24378e 48%,#172466 100%);border:1px solid #0a1033;border-radius:6px;
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset -1px -1px 0 rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.5);
 min-height:46px;padding:4px 6px;text-shadow:0 1px 1px rgba(0,0,0,.75);touch-action:manipulation}
#pad button small{display:block;font-weight:normal;font-size:12px;color:#ecebe6}
#pad button.dim{color:#9aa1ae;background:linear-gradient(180deg,#4a4e58 0%,#2e3138 50%,#202227 100%);border-color:#0d0e11}
#pad button.red{color:#fff;background:linear-gradient(180deg,#d9483a 0%,#9e2220 50%,#5e1012 100%);border-color:#2e0607}
#pad button.grn{color:#fff;background:linear-gradient(180deg,#45b45c 0%,#22773a 50%,#124321 100%);border-color:#06200d}
#pad button.wide{grid-column:1/-1}#pad button.span2{grid-column:span 2}
#pad button:active{filter:brightness(1.2);transform:translateY(1px);
 box-shadow:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.25),0 1px 1px rgba(0,0,0,.5)}
#pad input{grid-column:1/-1;font:bold 20px/1.2 "Consolas","Menlo",monospace;color:#ffe066;background:linear-gradient(#07080c,#181b24);border:1px solid #000;
 box-shadow:inset 1px 1px 0 rgba(0,0,0,.7),inset -1px -1px 0 rgba(255,255,255,.2);border-radius:6px;padding:10px;min-height:46px;box-sizing:border-box;width:100%}
#intro{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#intro video{max-width:96vw;max-height:84vh;border:2px solid #c9a24a;border-radius:8px;box-shadow:0 0 40px #000;background:#000}
#intro button{font:bold 16px monospace;color:#ffd84a;background:linear-gradient(#2a3f9a,#13226a);border:2px solid #55ffff;border-radius:6px;padding:8px 18px;cursor:pointer}
#pad .hud{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;padding:6px 10px;border-radius:6px;
 font:13px/1.25 "Consolas","Menlo","Courier New",monospace;color:#ecebe6;background:linear-gradient(180deg,#1d2c72,#141a44);border:1px solid #070b26;
 box-shadow:inset 1px 1px 0 rgba(147,169,255,.45),inset -1px -1px 0 rgba(0,0,0,.5)}
#pad .hud span{display:flex;flex-direction:column;min-width:0}#pad .hud i{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#74e4ef}
#pad .hud b{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pad .hud .y{color:#ffd84a}#pad .hud .g{color:#72e083}#pad .hud .r{color:#ff6f61}#pad .hud .c{color:#74e4ef}
@media (orientation:landscape){#pad .hud{display:none}}
@media (orientation:portrait){body.touch #pad button{min-height:56px;font-size:17px}body.touch #pad button small{font-size:13px}}
#hint{display:none;color:#7c8494;font:12px monospace;text-align:center}
@media (orientation:landscape){body.touch{flex-direction:row}
 body.touch #pad{width:auto;flex:1 1 0;max-width:340px;max-height:100%}}
@media (orientation:portrait){body.touch #hint{display:block}}

function cellRect(d){const x=sx(d.x),y=sy(d.y);return[x,y,sx(d.x+d.w)-x,sy(d.y+d.h)-y];}
function lg(x0,y0,x1,y1,a,b,c){const g=GC.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);if(c){g.addColorStop(.5,b);g.addColorStop(1,c);}else g.addColorStop(1,b);return g;}
function bevel(x,y,w,h,lt,dk,n){const c=GC,p=1;for(let i=0;i<n;i++){const o=i*p;
 c.fillStyle=lt;c.fillRect(x+o,y+o,w-2*o,p);c.fillRect(x+o,y+o,p,h-2*o);
 c.fillStyle=dk;c.fillRect(x+o,y+h-o-p,w-2*o,p);c.fillRect(x+w-o-p,y+o,p,h-2*o);}}
function softShadow(x,y,w,h,r){const c=GC,n=Math.min(r,6),st=r/n;for(let j=n;j>0;j--){const i=j*st;c.fillStyle='rgba(0,0,0,'+(.5/n).toFixed(3)+')';c.fillRect(x+3+i*.6-r*.3,y+4+i*.6-r*.3,w+r*.6-i*1.2+1,h+r*.6-i*1.2+1);}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function drawPanel(d){const c=GC,st=PST[d.s]||PST.popup;let[x,y,w,h]=cellRect(d);const g=Math.max(1,Math.round(CW*.18));
 const o1=CH<14?.5:1;x+=o1;y+=o1;w-=2*o1;h-=2*o1;softShadow(x,y,w,h,Math.max(3,Math.round(CH*.35)));
 c.fillStyle=lg(0,y,0,y+h,st.body[0],st.body[1]);c.fillRect(x,y,w,h);
 if(st.grain){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.lineWidth=1;
  const gs=Math.max(3,Math.round(CH/7));for(let i=0,n=Math.ceil(h/gs);i<n;i++){const yy=y+i*gs+((i*7)%3);c.strokeStyle=i%3?'rgba(0,0,0,.16)':'rgba(255,200,120,.05)';c.beginPath();c.moveTo(x,yy);
   for(let xx=0;xx<=w;xx+=Math.max(24,gs*8))c.lineTo(x+xx,yy+Math.sin((xx+i*37)*.05*3/gs)*1.2*gs/3);c.stroke();}c.restore();}
 // top highlight sheen
 c.fillStyle=lg(0,y,0,y+h*.5,'rgba(255,255,255,.07)','rgba(255,255,255,0)');c.fillRect(x,y,w,h*.5);
 // caption bar on the panel's title row
 const cg=CH<14&&!d.cap?1:g,cy=sy(d.y+d.cap)+cg,ch=sy(d.y+d.cap+1)-sy(d.y+d.cap)-cg;
 c.fillStyle=lg(x,0,x+w,0,st.cap[0],st.cap[1]);c.fillRect(x+g,cy,w-2*g,ch);
 c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x+g,cy,w-2*g,1);c.fillStyle='rgba(0,0,0,.45)';c.fillRect(x+g,cy+ch-1,w-2*g,1);
 // outer raised bevel + trim line + inner sunken edge
 bevel(x,y,w,h,hexA(st.trim,.85),st.edge,1);bevel(x+1,y+1,w-2,h-2,hexA(st.trim,.35),hexA(st.edge,.7),1);
 if(CH>=14){c.strokeStyle=hexA(st.trim,.55);c.lineWidth=1;c.strokeRect(x+g-.5,y+g-.5,w-2*g+1,h-2*g+1);}
 if(d.cap){const by=y+g,bh=cy-by-1;bevel(x+g,by,w-2*g,bh,'rgba(0,0,0,.6)','rgba(255,255,255,.3)',1);}}

 if(d.s==='dusk')g=lg(0,0,0,h,'#1a1440','#4a2550','#b0503a');else g=lg(0,0,0,h,'#1a1d27','#101219','#0a0b10');

const gicoCache={};
function drawGoodIcon(c,n,x,y,s){let b=gicoCache[n];if(!b){b=document.createElement('canvas');b.width=b.height=16;const g=b.getContext('2d');GICO[n](g);gicoCache[n]=b;}
 const prev=c.imageSmoothingEnabled;c.imageSmoothingEnabled=false;c.drawImage(b,x,y,s,s);c.imageSmoothingEnabled=prev;}
function drawIco(d){const c=GC,z=d.z||1,s=Math.max(6,Math.round(CH*z*DPR)/DPR),x=Math.round((d.x*CW+(2*z*CW-s)/2)*DPR)/DPR,y=Math.round((d.y*CH+(CH*Math.ceil(z)-s)/2)*DPR)/DPR;
 c.save();try{if(String(d.n).indexOf('wx_')===0)drawWxIcon(c,d.n.slice(3),x,y,s);else if(GICO[d.n])drawGoodIcon(c,d.n,x,y,s);else if(window.GFX&&typeof GFX.icon==='function')GFX.icon(c,d.n,x,y,s);else fallbackIcon(c,d.n,x,y,s);}catch(e){fallbackIcon(c,d.n,x,y,s);}c.restore();}
function fallbackScene(c,n,x,y,w,h){const night=n==='cops',dusk=n==='gameover'||n==='title';
 c.fillStyle=lg(0,y,0,y+h,night?'#050820':dusk?'#2a1850':'#3f7fd0',night?'#1a2050':dusk?'#e0703a':'#bfe0f5');c.fillRect(x,y,w,h);
 c.fillStyle=night?'#151a10':'#c99a2e';c.beginPath();c.moveTo(x,y+h*.7);c.quadraticCurveTo(x+w*.3,y+h*.5,x+w*.6,y+h*.68);c.quadraticCurveTo(x+w*.85,y+h*.8,x+w,y+h*.62);
 c.lineTo(x+w,y+h);c.lineTo(x,y+h);c.fill();c.fillStyle=night?'#0c0f08':'#a8781c';c.fillRect(x,y+h*.86,w,h*.14);}
function scnRect(d){let[x,y,w,h]=cellRect(d);if(d.win){const g=Math.max(2,Math.round(CW*.25));x+=g;y+=Math.max(1,Math.round(CH*.15));w-=g+Math.max(1,Math.round(CW*.1));h-=Math.max(2,Math.round(CH*.3));}if(d.ins){const g=Math.max(2,Math.round(CW*.18))+2;x+=g;y+=g;w-=2*g;h-=g+1;}return[x,y,w,h];}
function drawScn(d,t){const c=GC,[x,y,w,h]=scnRect(d);c.save();c.beginPath();c.rect(x,y,w,h);c.clip();const[sn,wk]=String(d.n).split('|');
 try{if(window.GFX&&typeof GFX.scene==='function')GFX.scene(c,sn,x,y,w,h,t);else fallbackScene(c,sn,x,y,w,h);}catch(e){fallbackScene(c,sn,x,y,w,h);}
 try{if(wk)drawWeather(c,wk,x,y,w,h,t);}catch(e){}
 c.restore();if(d.ins)bevel(x-1,y-1,w+2,h+2,'rgba(0,0,0,.55)','rgba(255,255,255,.35)',1);
 if(d.win){bevel(x-2,y-2,w+4,h+4,'rgba(0,0,0,.7)','rgba(170,190,255,.45)',1);bevel(x-1,y-1,w+2,h+2,'rgba(0,0,0,.45)','rgba(255,255,255,.18)',1);
  if(wk&&wk!=='clear'){try{const s=Math.max(10,Math.round(CH*.9));c.fillStyle='rgba(6,8,24,.6)';c.fillRect(x+w-s-4,y+2,s+2,s+2);drawWxIcon(c,wk,x+w-s-3,y+3,s);}catch(e){}}}}
function drawVeil(d){const c=GC,[x,y,w,h]=cellRect(d),r=Math.min(CH*.5,10);c.fillStyle=d.act?lg(0,y,0,y+h,'rgba(30,26,58,'+d.a+')','rgba(8,8,20,'+d.a+')'):'rgba(10,9,22,'+d.a+')';c.beginPath();
 if(c.roundRect)c.roundRect(x+.5,y+.5,w-1,h-1,r);else c.rect(x,y,w,h);c.fill();c.strokeStyle=d.act?'rgba(255,216,110,.7)':'rgba(232,194,90,.35)';c.lineWidth=1;c.stroke();
 if(d.act){c.fillStyle='rgba(255,255,255,.08)';c.fillRect(x+r,y+2,w-2*r,1);}}
function drawSVeil(d){const c=GC,[x,y,w,h]=cellRect(d);
 if(d.solid){c.fillStyle=lg(0,y,0,y+h,'#16215e','#1b1650');c.fillRect(x,y,w,h);c.fillStyle='rgba(255,255,255,.035)';
  for(let r=0;r<d.h;r+=2)c.fillRect(x,sy(d.y+r),w,sy(d.y+r+1)-sy(d.y+r));return;}const g=c.createLinearGradient(x,0,x+w,0);
 g.addColorStop(0,'rgba(16,22,78,.93)');g.addColorStop(.42,'rgba(20,22,80,.88)');g.addColorStop(.68,'rgba(26,22,84,.62)');g.addColorStop(.86,'rgba(30,22,86,.22)');g.addColorStop(1,'rgba(30,22,86,0)');
 c.fillStyle=g;c.fillRect(x,y,w,h);}
// gauge: sunken trough + gradient fill + segment ticks (d.v 0..1, d.c color set)
const GCOL={g:['#9af59f','#2fa84a','#17602a'],y:['#ffe98a','#e0a420','#8a5a08'],r:['#ff9d8a','#d23a2a','#6e1010'],b:['#b6c8ff','#4a6ee0','#1d2f80'],p:['#f6b8f2','#b04cb0','#5a1a5e']};
function drawGauge(d){const c=GC;let[x,y,w,h]=cellRect(d);const p=Math.max(2,Math.round(CH*.2));y+=p;h-=2*p;
 c.fillStyle=lg(0,y,0,y+h,'#05060a','#1a1d26');c.fillRect(x,y,w,h);bevel(x,y,w,h,'rgba(0,0,0,.85)','rgba(255,255,255,.28)',1);
 const v=Math.max(0,Math.min(1,d.v)),fw=Math.round((w-2)*v),cs=GCOL[d.c]||GCOL.g;
 if(fw>0){c.fillStyle=lg(0,y+1,0,y+h-1,cs[0],cs[1],cs[2]);c.fillRect(x+1,y+1,fw,h-2);c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x+1,y+1,fw,1);}
 if(d.seg){c.fillStyle='rgba(0,0,0,.45)';for(let i=1;i<d.seg;i++){const xx=Math.round(x+1+(w-2)*i/d.seg);c.fillRect(xx,y+1,1,h-2);}}}

function drawWCard(d){const c=GC,[x,y,w,h]=cellRect(d);c.fillStyle=lg(0,y,0,y+h,'#0e0a1c','#1d1430');c.fillRect(x,y,w,h);

function drawVLine(d){const c=GC,x=Math.round(sx(d.x))+.5,y0=sy(d.y),y1=sy(d.y+d.h);c.fillStyle='rgba(0,0,0,.45)';c.fillRect(x-1,y0,1,y1-y0);c.fillStyle=d.col||'rgba(255,220,150,.14)';c.fillRect(x,y0,1,y1-y0);}

function drawBig(d){// chunky beveled block letters, cached per cell size
 const key=d.key+'|'+CW+'|'+CH+'|'+DPR;if(!bigCache||bigCache.key!==key){const cv=document.createElement('canvas');cv.width=Math.ceil(W*CW*DPR);cv.height=Math.ceil(sy(Math.max(...d.L.map(L=>L.y))+6)*DPR);
  const c=cv.getContext('2d'),save=GC;GC=c;c.setTransform(DPR,0,0,DPR,0,0);
  for(const L of d.L){const at=(i,r)=>r>=0&&r<5&&L.rows[r][i]==='█',X0=L.x,Y0=L.y,pad=Math.max(1,CW*.08);
   const g=c.createLinearGradient(0,sy(Y0),0,sy(Y0+5));L.g.forEach((s,i)=>g.addColorStop(i/(L.g.length-1),s));
   for(let pass=0;pass<2;pass++)for(let r=0;r<5;r++)for(let i=0;i<L.rows[r].length;i++){if(!at(i,r))continue;
    const x=sx(X0+i),y=sy(Y0+r),w=sx(X0+i+1)-x,h=sy(Y0+r+1)-y;
    if(!pass){c.fillStyle='rgba(0,0,0,.55)';c.fillRect(x+3,y+4,w,h);c.fillStyle='rgba(0,0,0,.85)';c.fillRect(x-pad,y-pad,w+2*pad,h+2*pad);continue;}
    c.fillStyle=g;c.fillRect(x,y,w+.5,h+.5);
    if(!at(i,r-1)){c.fillStyle='rgba(255,255,255,.55)';c.fillRect(x,y,w,Math.max(1,h*.14));}
    if(!at(i-1,r)){c.fillStyle='rgba(255,255,255,.3)';c.fillRect(x,y,Math.max(1,w*.16),h);}
    if(!at(i,r+1)){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(x,y+h-Math.max(1,h*.16),w,Math.max(1,h*.16));}
    if(!at(i+1,r)){c.fillStyle='rgba(0,0,0,.35)';c.fillRect(x+w-Math.max(1,w*.16),y,Math.max(1,w*.16),h);}}}
  GC=save;bigCache={key,cv};}
 GC.drawImage(bigCache.cv,0,0,bigCache.cv.width/DPR,bigCache.cv.height/DPR);}
function drawDec(d,t){switch(d.t){case'bk':return drawBack(d);case'bar':return drawBar(d);case'panel':return drawPanel(d);case'ico':return drawIco(d);
 case'scn':return drawScn(d,t);case'veil':return drawVeil(d);case'sveil':return drawSVeil(d);case'gauge':return drawGauge(d);case'wcard':return drawWCard(d);case'row':return drawRow(d);case'vline':return drawVLine(d);case'inset':return drawInset(d);case'big':return drawBig(d);

function drawWeather(c,k,x,y,w,h,t){if(!k||k==='clear')return;const N=(a)=>Math.min(160,Math.max(8,Math.round(w*h/a)));t=t||0;

  if(k==='storm'){const ph=(t/90|0)%41;if(ph===0||ph===2){c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x,y,w,h);
   c.strokeStyle='rgba(255,250,200,.95)';c.lineWidth=2;c.beginPath();let bx=x+w*(.2+seed(t/3690|0)*.6),by=y;c.moveTo(bx,by);
   while(by<y+h*.7){bx+=(seed(by)-.5)*w*.06;by+=h*.08;c.lineTo(bx,by);}c.stroke();}}}
 else if(k==='snow'){c.fillStyle='rgba(225,235,255,.18)';c.fillRect(x,y,w,h);c.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<N(900);i++){const px=x+((seed(i)*w+Math.sin(t/900+i)*6+w)%w),py=y+((seed(i+50)*h+t*(.03+seed(i+3)*.03))%h);c.fillRect(px,py,1.6+seed(i+9)*1.4,1.6+seed(i+9)*1.4);}}
 else if(k==='fog'){for(let b=0;b<5;b++){const yy=y+h*(.25+b*.16),off=((t/40)*(b%2?1:-1)+b*97)%(w*2);const g=c.createLinearGradient(0,yy-h*.12,0,yy+h*.12);

 else if(k==='wind'){c.strokeStyle='rgba(235,245,255,.35)';c.lineWidth=1;c.beginPath();for(let i=0;i<N(4000);i++){const px=x+((seed(i)*w*1.5+t*.4)%(w*1.5))-w*.25,py=y+seed(i+20)*h;c.moveTo(px,py);c.lineTo(px+w*.06,py+1);}c.stroke();}
 else if(k==='dust'){c.fillStyle='rgba(150,108,58,.45)';c.fillRect(x,y,w,h);c.fillStyle='rgba(120,84,40,.6)';
  for(let i=0;i<N(700);i++){const px=x+((seed(i)*w+t*.25)%w),py=y+((seed(i+40)*h+Math.sin(t/500+i)*4+h)%h);c.fillRect(px,py,1.5,1.5);}}
 else if(k==='hot'){c.fillStyle='rgba(255,140,40,.16)';c.fillRect(x,y,w,h);c.strokeStyle='rgba(255,235,200,.25)';c.lineWidth=1;
  for(let i=0;i<4;i++){const yy=y+h*(.72+i*.06);c.beginPath();for(let xx=0;xx<=w;xx+=6)c.lineTo(x+xx,yy+Math.sin(xx/14+t/220+i)*1.5);c.stroke();}}}

   B('Cancel','ESC',{cls:'red'}),B('OK '+(S.input||'0'),'ENTER',{cls:'grn span2'}),B('Help','HELP',{cls:'wide'})])};
  case'jet':return{cols:2,b:LOCS.map((l,i)=>B(l.n,String(i+1),{cls:i===S.loc?'dim':'',sub:i===S.loc?'you are here':''})).concat([B('Cancel','ESC',{cls:'red wide'})])};
  case'shark':return{cols:3,b:[B('Pay back','P',{cls:'grn'}),B('Borrow','O'),B('Leave','ESC',{cls:'red'})]};
  case'bank':return{cols:3,b:[B('Deposit','D',{cls:'grn'}),B('Withdraw','W'),B('Leave','ESC',{cls:'red'})]};
  case'quit':return{cols:2,b:[B('Yes, quit','Y',{cls:'red'}),B('No','N',{cls:'grn'})]};}
 return{cols:1,b:[]};}

// scale the 80x25 screen to fit what's left of the viewport
let charW=0;
function fit(){const scr=document.getElementById('scr'),crt=document.getElementById('crt');
 if(!charW){const t=document.createElement('span');t.style.cssText='position:absolute;visibility:hidden;white-space:pre;font:100px '+getComputedStyle(scr).fontFamily;
  t.textContent='M'.repeat(80);document.body.appendChild(t);charW=t.getBoundingClientRect().width/80/100;t.remove();}
 const vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight,pad=16+(crt.offsetWidth-scr.offsetWidth);
 let aw=vw-pad,ah=vh-pad;
 if(TOUCH){if(matchMedia('(orientation:landscape)').matches)aw-=Math.min(340,Math.max(170,vw*.26));
  else ah-=Math.max(200,vh*.36)+18;}
 const fs=Math.max(4,Math.min(TOUCH?20:400,aw/(80*charW),ah/(25*1.12)));scr.style.fontSize=fs.toFixed(2)+'px';gfxResize();}
